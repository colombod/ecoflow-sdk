name: CI

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Unit tests
        run: uv run pytest -m "not integration and not write_integration" -v

      # The live REST/MQTT test modules, replayed against the service twin
      # (ecoflow_twin): real HTTPS + MQTT/TLS on local ports, one twin per
      # recording in tests/recordings/. No secrets, no network.
      - name: Replay recorded sessions
        run: uv run pytest tests/e2e --live=replay -v

  # Non-Python clients against the twin: signed REST with curl + openssl,
  # MQTT over TLS with mosquitto_sub (scripts/twin_smoke.sh).
  twin-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install MQTT CLI clients
        run: sudo apt-get update && sudo apt-get install -y mosquitto-clients

      - name: Install dependencies
        run: uv sync --all-extras

      - name: curl + mosquitto_sub against the service twin
        run: bash scripts/twin_smoke.sh

  # Real live tests are deliberately NOT run in CI: they would share the
  # account's single MQTT session with the owner's live system (AGENTS.md
  # Quirk 2), and write tests move real hardware. Run them ad hoc on a trusted
  # machine instead — see python/docs/api/live-testing.md.
