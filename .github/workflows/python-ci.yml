name: CI

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Unit tests
        run: uv run pytest -m "not integration and not write_integration" -v

      # The live REST/MQTT test modules, replayed offline against every
      # redacted recording in tests/recordings/ (tests/support/replay.py).
      # No secrets, no network: the SDK talks to a fake REST server and broker.
      - name: Replay recorded sessions
        run: uv run pytest tests/e2e --live=replay -v

  # Real live tests are deliberately NOT run in CI: they would share the
  # account's single MQTT session with the owner's live system (AGENTS.md
  # Quirk 2), and write tests move real hardware. Run them ad hoc on a trusted
  # machine instead — see python/docs/api/live-testing.md.
